<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="PresentShow 主唱介面：演唱順序、預備段落與多頁歌詞。">
  <title>PresentShow · 主唱介面</title>
  <link rel="stylesheet" href="src/styles/singer.css">
  <link rel="stylesheet" href="src/styles/singer1.css">
</head>
<body>
  <main class="singer-app" aria-label="PresentShow 主唱介面">
    <header class="song-heading">
      <button id="previous-song" class="icon-button song-arrow" aria-label="瀏覽上一首歌"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button>
      <div class="song-title"><div class="heading-meta"><span id="song-number">1/3</span><span>PRESENTSHOW · 主唱</span></div><h1 id="song-title">高聲唱</h1></div>
      <button id="next-song" class="icon-button song-arrow" aria-label="瀏覽下一首歌"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button>
      <button id="fullscreen" class="icon-button" aria-label="進入全螢幕" title="全螢幕"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button>
    </header>
    <nav id="song-tabs" class="song-tabs" aria-label="瀏覽歌曲（只切換畫面）"></nav>
    <section class="route-panel" aria-label="演唱路徑">
      <div class="route-row"><span class="row-label">已唱過</span><div id="route-past" class="route-strip" aria-label="已唱過的段落"></div></div>
      <div id="route-window" class="route-window" aria-label="前一個、目前、下一個與下下一個"></div>
      <div class="route-row"><span class="row-label">之後</span><div id="route-future" class="route-strip" aria-label="之後的段落"></div></div>
    </section>
    <section id="sections" class="section-buttons" aria-label="預備歌曲段落與歌詞頁"></section>
    <section id="utility-buttons" class="utility-buttons" aria-label="預備演唱提示"></section>
    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="src/singer.js"></script>
</body>
</html>
