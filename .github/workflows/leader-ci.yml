name: PresentShow tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          node --check cloudflare/worker.js
          node --check src/leader/leader-sync.js
          node --check src/leader/leader-runtime.js
          node --check src/leader/controller-sync.js
