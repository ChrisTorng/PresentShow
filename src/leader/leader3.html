<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a19">
  <meta name="description" content="PresentShow Leader 3：固定段落快捷鍵與完整演唱順序的雙向同步。">
  <title>PresentShow · Leader 3</title>
  <link rel="stylesheet" href="./styles/singer.css">
  <link rel="stylesheet" href="./styles/leader.css">
  <link rel="stylesheet" href="./styles/leader3-flow.css">
</head>
<body>
  <main class="singer-app leader-flow-app" aria-label="PresentShow Leader 3">
    <header class="song-heading">
      <button id="previous-song" class="icon-button song-arrow" aria-label="瀏覽上一首歌"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button>
      <div class="song-title"><div class="heading-meta"><span id="song-number">1/3</span><span>PRESENTSHOW · LEADER 3</span></div><h1 id="song-title">高聲唱</h1></div>
      <button id="next-song" class="icon-button song-arrow" aria-label="瀏覽下一首歌"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button>
      <button id="fullscreen" class="icon-button" aria-label="切換全螢幕" title="全螢幕"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h-5m11-5v5h-5"/></svg></button>
    </header>
    <nav id="song-tabs" class="song-tabs" aria-label="瀏覽歌曲，不會切換主控"></nav>
    <section class="flow-layout" aria-label="段落快捷鍵與完整播放順序">
      <aside class="flow-sidebar" aria-label="此首歌固定段落快捷鍵">
        <div class="flow-sidebar-caption">段落</div>
        <div id="section-shortcuts" class="flow-shortcuts"></div>
      </aside>
      <div class="flow-panel">
        <div id="flow-scroll" class="flow-scroll" role="region" aria-label="完整演唱順序，向上可查看已播放內容">
          <div id="flow-sequence" class="flow-sequence"></div>
        </div>
      </div>
    </section>
    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="./leader3.js"></script>
</body>
</html>
